[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bathycube"
dynamic = ["version"]
description = "A Python implementation of the UNH CUBE module for gridding Bathymetric data."
readme = "README.md"
requires-python = ">=3.14"
license = {text = "MIT"}
authors = [
    {name = "Eric Younkin", email = "eric.g.younkin@noaa.gov"},
]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
    "numba>=0.52.0",
    "numpy>=1.20.1",
]

[project.urls]
Homepage = "https://github.com/noaa-ocs-hydrography/bathycube"

[tool.setuptools.dynamic]
version = {attr = "bathycube.__version__.__version__"}

[tool.setuptools.packages.find]
exclude = ["tests*"]

[dependency-groups]
dev = [
    "pre-commit",
    "pylint>=4.0.8",
    "pytest",
    "pytest-cov",
    "ruff>=0.16.5",
    "ty>=0.0.77",
]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = [
    "B008",     # function-call-in-default-argument
    "E722",     # bare-except
    "F541",     # f-string-missing-placeholders
    "F811",     # redefined-while-unused
    "F841",     # unused-variable
    "I001",     # unsorted-imports
    "PLR1730",  # if-stmt-min-max
    "RUF013",   # implicit-optional
    "RUF059",   # unused-unpacked-variable
    "S102",     # exec-builtin
    "SIM103",   # needless-bool
    "SIM114",   # if-with-same-arms
    "UP032",    # f-string
]

[tool.ty.rules]
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
invalid-method-override = "ignore"
invalid-parameter-default = "ignore"
invalid-type-form = "ignore"
too-many-positional-arguments = "ignore"
unresolved-attribute = "ignore"

[tool.pytest.ini_options]
addopts = "--cov=bathycube --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
source = ["bathycube"]
branch = true

[tool.pylint.main]
max-line-length = 120

[tool.pylint.messages_control]
disable = [
    "arguments-renamed",
    "cell-var-from-loop",
    "consider-using-enumerate",
    "consider-using-f-string",
    "consider-using-in",
    "consider-using-max-builtin",
    "duplicate-code",
    "exec-used",
    "f-string-without-interpolation",
    "fixme",
    "import-error",
    "import-outside-toplevel",
    "inconsistent-return-statements",
    "invalid-name",
    "line-too-long",
    "logging-fstring-interpolation",
    "missing-class-docstring",
    "missing-function-docstring",
    "missing-module-docstring",
    "multiple-imports",
    "no-else-return",
    "no-member",
    "protected-access",
    "raise-missing-from",
    "redefined-outer-name",
    "reimported",
    "simplifiable-if-statement",
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-branches",
    "too-many-instance-attributes",
    "too-many-lines",
    "too-many-locals",
    "too-many-nested-blocks",
    "too-many-positional-arguments",
    "too-many-public-methods",
    "too-many-statements",
    "unbalanced-tuple-unpacking",
    "unnecessary-dunder-call",
    "unspecified-encoding",
    "unused-argument",
    "unused-variable",
    "unused-wildcard-import",
    "use-implicit-booleaness-not-comparison",
    "wildcard-import",
    "wrong-import-order",
]

[tool.coverage.report]
show_missing = true
